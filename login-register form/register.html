<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <div class="container registerContainer">
        <div class="title">Register</div>
        <div class="inputBox">
            <input type="text" placeholder="Username" class="username">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="invalidUsername error-message">

        </div>
        <div class="passwordBox">
            <input type="password" placeholder="Password" class="password">
            <div class="eyeContainer">
                <i class="fa-solid fa-eye-slash"></i>
            </div>
        </div>
        <div class="invalidPassword error-message" >
            
        </div>
        <div class="idBox">
            <input type="text" placeholder="ID" class="id">
            <i class="fa-solid fa-hashtag"></i>
            
        </div>
        <div class="invalidID error-message">

        </div>


        <div class="only-remember">
            <div class="rememberContainer">
                <input type="checkbox">
                <span class="rememberText">Remember me</span>
            </div>
            
        </div>
        <button class="register">Register</button>
        <div class="loginBox">
            <div class="noAccount">Already have an account?  </div>
            <a href="login.html" class="loginLink">Login</a>
        </div>
    </div>
    <script src="script-register.js"></script>
</body>
</html>
