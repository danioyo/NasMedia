<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <div class="container loginContainer">
        <div class="title">Login</div>
        <div class="inputBox">
            <input type="text" placeholder="Username" class="username">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="invalidUsername error-message">

        </div>
        <div class="passwordBox">
            <input type="password" placeholder="Password" class="password">
            <div class="eyeContainer">
                <i class="fa-solid fa-eye-slash"></i>
            </div>
        </div>
        <div class="invalidPassword error-message" >
            
        </div>
        <div class="remember-forgot">
            <div class="rememberContainer">
                <input type="checkbox">
                <span class="rememberText">Remember me</span>
            </div>
            <a href="">Forgot password?</a>
        </div>
        <button class="login">Login</button>
        <div class="registerBox">
            <div class="noAccount">Don't have an account? </div>
            <a href="register.html" class="registerLink">Register</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
